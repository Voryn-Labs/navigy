name: Publish macOS preview

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Package macOS preview run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify build provenance
        id: build
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh run view "$BUILD_RUN" --json conclusion,headBranch,workflowName,headSha > run.json
          jq -e '.conclusion == "success" and .headBranch == "main" and .workflowName == "Package macOS preview"' run.json > /dev/null
          jq -r '"commit=" + .headSha' run.json >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: Navigy-macOS-preview
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
      - name: Verify and publish
        env:
          BUILD_COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          set -euo pipefail
          ditto -x -k release/Navigy.zip unpacked
          ./scripts/verify_universal.sh unpacked/Navigy.app Navigy
          ./scripts/verify_signing.sh unpacked/Navigy.app --require any
          hdiutil verify -quiet release/Navigy.dmg
          version=$(plutil -extract CFBundleShortVersionString raw -o - unpacked/Navigy.app/Contents/Info.plist)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (cd release && shasum -a 256 Navigy.dmg Navigy.zip > SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          Navigy adds a floating action bar to selected text on macOS. Press **⌥⌘C** to search all actions. This preview includes a new compass icon and local summaries in a plain result card.
          
          Both packages support Apple Silicon and Intel Macs running macOS 14 or later. The app asks for Accessibility permission to read selections. Screen Recording is used when you explicitly choose Capture Text.
          
          This preview is ad-hoc signed and has no Apple notarization. Gatekeeper may block the download. To build a local copy, see the [Xcode instructions](https://github.com/Voryn-Labs/navigy#build-and-run).
          NOTES
          gh release create "v$version-preview" release/Navigy.dmg release/Navigy.zip release/SHA256SUMS.txt \
            --target "$BUILD_COMMIT" --title "Navigy $version Preview" --prerelease --notes-file release-notes.md
